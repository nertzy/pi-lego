name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a matching version tag
        run: node scripts/check-release-ref.ts
      # Trusted publishing requires npm 11.5.1 or newer. Node's bundled npm
      # can lag that requirement even when the Node release is current.
      - run: npm install --global npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --access public --provenance
