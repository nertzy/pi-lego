name: Publish to npm

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a matching version tag
        run: node scripts/check-release-ref.ts
      - name: Require release notes
        run: node scripts/extract-release-notes.ts "${GITHUB_REF_NAME#v}" > /dev/null
      - run: npm ci
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) \
            1.7.12 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - name: Stage package
        id: stage
        run: |
          set -o pipefail
          npm stage publish --access public --provenance 2>&1 | tee "$RUNNER_TEMP/stage-output.txt"
          stage_id=$(grep -oE 'staged with id [0-9a-f-]{36}' "$RUNNER_TEMP/stage-output.txt" | grep -oE '[0-9a-f-]{36}')
          if [ -z "$stage_id" ]; then
            echo "::warning::Could not parse the stage id from npm stage publish output"
          fi
          echo "stage-id=$stage_id" >> "$GITHUB_OUTPUT"
      - name: Announce the staged release
        env:
          STAGE_ID: ${{ steps.stage.outputs.stage-id }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').name")
          url="https://www.npmjs.com/settings/nertzy/staged-packages?filterPackage=$package&filterVersion=$version"
          {
            echo "## :package: \`$package@$version\` is staged — not live yet"
            echo
            echo "### [:arrow_right: Review and approve the staged release on npmjs.com]($url)"
            echo
            echo "A maintainer with npm 2FA must approve the stage before anyone can install it:"
            echo
            echo "1. **Review** — \`npm stage view $STAGE_ID\`, or \`npm stage download $STAGE_ID\` to inspect the tarball."
            echo "2. **Approve** — \`npm stage approve $STAGE_ID\`, or **Approve** on npmjs.com. 2FA is required either way."
            echo
            echo "Stage ID: \`$STAGE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$package@$version staged::Approve the staged release on npmjs.com (stage id $STAGE_ID) to make it installable."

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Create GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-release-notes.ts \
            "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
