name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) \
            1.7.12 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Smoke-test the published package shape
        shell: bash
        run: |
          tarball=$(npm pack --json | node -e \
            "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const data = JSON.parse(input); console.log((Array.isArray(data) ? data[0] : Object.values(data)[0]).filename); })")
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir" "$tarball"' EXIT
          npm install --prefix "$smoke_dir" "$PWD/$tarball" @earendil-works/pi-coding-agent
          (
            cd "$smoke_dir"
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { resolve } from "node:path";
              import { discoverAndLoadExtensions } from "@earendil-works/pi-coding-agent";

              const extensionPath = resolve("node_modules/pi-lego/extension.ts");
              const loaded = await discoverAndLoadExtensions([extensionPath], process.cwd());
              assert.deepEqual(loaded.errors, []);
              const extension = loaded.extensions.find(
                candidate => candidate.resolvedPath === extensionPath,
              );
              assert.equal(extension?.handlers.get("tool_call")?.length, 1);
            '
          )
